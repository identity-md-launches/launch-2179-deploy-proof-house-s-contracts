[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [{ access = "read", path = "./reference" }]
gas_limit = "18446744073709551615"
memory_limit = 1073741824

[fuzz]
runs = 64

[fmt]
line_length = 120

[lint]
severity = ["high", "med"]
